<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-label="Anarchy logo">
  <title>Anarchy</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#660000"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="32" fill="#0a0a0a"/>
  <circle cx="120" cy="120" r="92" stroke="url(#ring)" stroke-width="6" fill="none"/>
  <!-- Anarchy "A" mark -->
  <g stroke="#e6e6e6" stroke-width="9" stroke-linecap="square" fill="none">
    <path d="M70 168 L120 60 L170 168"/>
    <path d="M55 168 L185 168" stroke="url(#ring)" stroke-width="6"/>
    <path d="M88 130 L152 130"/>
  </g>
  <!-- corner glitch -->
  <rect x="178" y="42" width="20" height="3" fill="#cc0000"/>
  <rect x="178" y="48" width="12" height="2" fill="#cc0000" opacity="0.6"/>
</svg>
