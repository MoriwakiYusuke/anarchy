<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Anarchy banner">
  <title>Anarchy — 支配なき秩序</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#660000"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" stroke="#1a1a1a" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Logo block -->
  <g transform="translate(72,80)">
    <circle cx="80" cy="80" r="76" stroke="url(#accent)" stroke-width="5" fill="none"/>
    <g stroke="#e6e6e6" stroke-width="7" stroke-linecap="square" fill="none">
      <path d="M40 130 L80 40 L120 130"/>
      <path d="M30 130 L130 130" stroke="url(#accent)" stroke-width="5"/>
      <path d="M58 100 L102 100"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="'Courier New', monospace" fill="#f0f0f0">
    <text x="260" y="150" font-size="84" font-weight="700" letter-spacing="4">Anarchy</text>
    <text x="262" y="200" font-size="22" fill="#888888" letter-spacing="3">支配なき秩序 — Anonymous · Decentralized · Censorship-resistant SNS</text>
    <text x="262" y="234" font-size="16" fill="#666666" letter-spacing="2">Substrate · libp2p · Tor · Wasm · Next.js</text>
  </g>

  <!-- Glitch accent -->
  <rect x="252" y="92" width="180" height="4" fill="url(#accent)"/>
  <rect x="252" y="100" width="92" height="2" fill="#cc0000" opacity="0.5"/>
  <rect x="1100" y="40" width="100" height="3" fill="#cc0000"/>
  <rect x="1100" y="48" width="60" height="2" fill="#cc0000" opacity="0.6"/>
  <rect x="1100" y="54" width="30" height="2" fill="#cc0000" opacity="0.3"/>
</svg>
