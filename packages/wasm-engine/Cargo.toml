[package]
name = "anarchy-wasm-engine"
version = "2.0.0"
edition = "2021"
authors = ["Anarchy Team"]
license = "MIT"
description = "Wasm cryptographic engine for KZG-VSS and MerkleTree operations"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
# Enable test utilities (init_test_srs) for integration tests
test-utils = []

[dependencies]
# KZG-VSS (arkworks stack)
ark-bls12-381 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-poly = { version = "0.5", default-features = false }
ark-poly-commit = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }

# Compression
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

# MerkleTree (legacy, keep for compatibility)
rs_merkle = "1.4"

# Legacy SSS (sharks) - to be removed in Phase 8 (T074)
sharks = "0.5"

# Blake2b hashing
blake2 = "0.10"

# Wasm bindings
wasm-bindgen = "0.2"
js-sys = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Error handling in Wasm
console_error_panic_hook = { version = "0.1", optional = true }

# Getrandom for Wasm
getrandom = { version = "0.2", features = ["js"] }

# Hybrid approach: AES-256-GCM encryption
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }

# Hybrid approach: Reed-Solomon erasure coding
reed-solomon-erasure = { version = "6.0", default-features = false }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
