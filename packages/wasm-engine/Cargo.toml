[package]
name = "anarchy-wasm-engine"
version = "2.0.0"
edition = "2021"
authors = ["Anarchy Team"]
license = "MIT"
description = "Wasm cryptographic engine for KZG-VSS and MerkleTree operations"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
# Enable test utilities (init_test_srs) for integration tests
test-utils = []

[dependencies]
# KZG-VSS (arkworks stack)
ark-bls12-381 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-poly = { version = "0.5", default-features = false }
ark-poly-commit = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }

# Compression
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

# MerkleTree (legacy, keep for compatibility)
rs_merkle = "1.4"

# Blake2b hashing
blake2 = "0.10"

# Wasm bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Error handling in Wasm
console_error_panic_hook = { version = "0.1", optional = true }

# Getrandom for Wasm
getrandom = { version = "0.2", features = ["js"] }

# Hybrid approach: AES-256-GCM encryption
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }

# Secure memory zeroization for cryptographic keys
zeroize = { version = "1.7", default-features = false, features = ["alloc"] }

# Hybrid approach: Reed-Solomon erasure coding
reed-solomon-erasure = { version = "6.0", default-features = false }

# Stealth address: X25519 key exchange
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

# Stealth address: Ed25519 signatures for proper pubkey derivation
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# Stealth address: Curve25519 for EC point operations
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc"] }

# Random number generation
rand_core = { version = "0.6", features = ["getrandom"] }

# Stealth address: Key derivation
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"

# DM: HKDF key derivation (feature 019)
hkdf = "0.12"

# DM: Sr25519 inner signature (feature 019)
schnorrkel = { version = "0.11", default-features = false, features = ["getrandom"] }

# DM: SCALE codec for DmEnvelope encode/decode (feature 019)
parity-scale-codec = { version = "3", default-features = false, features = ["derive"] }

# Stealth address: Base58 encoding for meta-address
bs58 = "0.5"

# Stealth address: JSON serialization for backup
serde_json = "1.0"

# Stealth address: Base64 encoding for backup
base64 = "0.22"

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Enable test-utils feature for integration tests
anarchy-wasm-engine = { path = ".", features = ["test-utils"] }

[profile.release]
opt-level = "s"
lto = true
