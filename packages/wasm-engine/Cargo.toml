[package]
name = "anarchy-wasm-engine"
version = "0.1.0"
edition = "2021"
authors = ["Anarchy Team"]
license = "MIT"
description = "Wasm cryptographic engine for SSS and MerkleTree operations"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
# Shamir's Secret Sharing
sharks = "0.5"

# MerkleTree
rs_merkle = "1.4"

# Blake2b hashing
blake2 = "0.10"

# Wasm bindings
wasm-bindgen = "0.2"
js-sys = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Error handling in Wasm
console_error_panic_hook = { version = "0.1", optional = true }

# Getrandom for Wasm (required by sharks)
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
