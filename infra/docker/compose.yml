# Anarchy 全コンテナ構成 (リファレンス)
#
# tor / chain / storage を 1 ホストで動かす最小構成。実デプロイではノード数を増やす
# (docs/superpowers/plans/2026-09-11-multi-provider-deployment.md 参照)。
#
# 使い方:
#   cp ../deploy/anarchy-portfolio-raw.json chainspec.json
#   cp storage.toml.example storage.toml     # signer_seed を openssl rand -hex 32 で生成
#   docker compose up -d netns tor
#   docker compose exec tor cat /var/lib/tor/anarchy-storage/hostname   # .env に設定
#   docker compose up -d
#
# ---- ネットワーク設計 (実測に基づく。変更前に必ず読むこと) ----
#
# 1. チェーンノードは netns コンテナの名前空間を共有し、127.0.0.1 でピアする。
#    torsocks は **プロセスの全 outbound を Tor に流す** ため、同一ホストのノード宛も
#    Tor で名前解決しようとして失敗する
#    (PERROR torsocks: socks5 libc connect: Connection refused)。
#    torsocks の除外設定は AllowOutboundLocalhost (127.0.0.0/8) しか無く、
#    サブネット単位の除外ができないため、localhost に寄せるしかない。
#
# 2. 名前空間の保持は tor ではなく netns コンテナに持たせる。
#    tor を直接 network_mode の対象にすると、tor 再起動で名前空間が作り直され、
#    相乗りしているチェーンが取り残されてピアが切れ、チェーンが分岐する (実測済み)。
#
# 3. tor の HiddenServicePort は転送先にホスト名を受け付けない (IP かソケットのみ)。
#    storage は別コンテナなので固定 IP を割り当てる。
#
# 4. storage は torsocks で包まない。outbound は同一ホストのチェーンだけで、
#    inbound は Hidden Service が転送する。
#    チェーンが別ホストにある構成 (AWS のストレージ単独ノード) では逆に包み、
#    --chain-url に .onion を指定する。

services:
  # ネットワーク名前空間の保持だけを担う。上記 2 の理由でこれが必要。
  netns:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      anarchy:
        ipv4_address: 172.28.0.10

  tor:
    build:
      context: ./tor
    image: anarchy/tor:local
    restart: unless-stopped
    network_mode: "service:netns"
    depends_on: [netns]
    volumes:
      - tor-data:/var/lib/tor
      - ./torrc:/etc/tor/torrc:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 9050"]
      interval: 5s
      timeout: 2s
      retries: 24
      start_period: 10s

  chain:
    image: ${ANARCHY_NODE_IMAGE:-ghcr.io/moriwakiyusuke/anarchy-node:latest}
    restart: unless-stopped
    network_mode: "service:netns"
    depends_on:
      tor:
        condition: service_healthy
    # chain は torsocks で包む。ストレージのエンドポイントは .onion で登録されるため、
    # fan-out には SOCKS 経由の名前解決が必要 (reqwest に socks feature が無い)。
    entrypoint: ["torsocks", "/usr/local/bin/anarchy-node"]
    command:
      - --chain=/etc/anarchy/chainspec.json
      - --base-path=/data
      - --listen-addr=/ip4/0.0.0.0/tcp/30333
      - --rpc-port=9944
      - --rpc-external
      - --rpc-cors=all
      - --mine
      - --coinbase=${ANARCHY_COINBASE:?ANARCHY_COINBASE を設定してください}
      - --randomx-mode=light
    volumes:
      - chain-data:/data
      - ./torsocks.conf:/etc/tor/torsocks.conf:ro
      - ./chainspec.json:/etc/anarchy/chainspec.json:ro

  storage:
    image: ${ANARCHY_STORAGE_IMAGE:-ghcr.io/moriwakiyusuke/anarchy-storage-node:latest}
    restart: unless-stopped
    depends_on:
      tor:
        condition: service_healthy
      chain:
        condition: service_started
    # 上記 4 の理由で torsocks を使わない。
    entrypoint: ["/usr/local/bin/anarchy-storage-node"]
    command:
      - --config=/etc/anarchy/storage.toml
      - --data-dir=/data
      - --rpc-port=3030
      # 他ホストのチェーンからも到達できる .onion を広告する。
      - --public-url=${ANARCHY_STORAGE_PUBLIC_URL:?tor の anarchy-storage/hostname を設定してください}
      # netns コンテナの IP 経由でチェーンの RPC に繋ぐ
      - --chain-url=ws://172.28.0.10:9944
    networks:
      anarchy:
        ipv4_address: 172.28.0.30
    volumes:
      - storage-data:/data
      - ./storage.toml:/etc/anarchy/storage.toml:ro

networks:
  anarchy:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  tor-data:
  chain-data:
  storage-data:
