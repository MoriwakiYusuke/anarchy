# Anarchy 全コンテナ構成 (リファレンス)
#
# tor / chain / storage を 1 ホストで動かす最小構成。実デプロイでは
# ノード数とポートを増やす (docs/superpowers/plans/ の計画を参照)。
#
# 使い方:
#   docker compose -f infra/docker/compose.yml up -d
#   docker compose -f infra/docker/compose.yml exec tor cat /var/lib/tor/anarchy-chain/hostname
#
# イメージは ghcr から引くか、ローカルでビルドしたものを使う:
#   ANARCHY_IMAGE_TAG=local docker compose -f infra/docker/compose.yml up -d
#
# ネットワーク方針:
#   ノードは compose ネットワーク内でのみ listen し、ポートを publish しない。
#   外部からの到達は tor の Hidden Service 経由のみ。
#   (--tor-mode による強制機構は削除済み。torsocks でラップするだけ。)

x-image-prefix: &registry ghcr.io/moriwakiyusuke

services:
  tor:
    build:
      context: ./tor
    image: anarchy/tor:local
    restart: unless-stopped
    networks:
      anarchy:
        ipv4_address: 172.28.0.10
    volumes:
      - tor-data:/var/lib/tor
      - ./torrc:/etc/tor/torrc:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 9050"]
      interval: 5s
      timeout: 2s
      retries: 24
      start_period: 10s

  chain:
    image: ${ANARCHY_NODE_IMAGE:-ghcr.io/moriwakiyusuke/anarchy-node:latest}
    restart: unless-stopped
    depends_on:
      tor:
        condition: service_healthy
    # chain は torsocks で包む。ストレージのエンドポイントは .onion で登録されるため、
    # fan-out には SOCKS 経由の名前解決が必要 (reqwest に socks feature が無い)。
    # 同一ホストのストレージ宛も Tor をループして届く。
    # torsocks.conf は compose からマウントする (TorAddress は IP のみ受け付けるため)。
    entrypoint: ["torsocks", "/usr/local/bin/anarchy-node"]
    command:
      - --chain=/etc/anarchy/chainspec.json
      - --base-path=/data
      - --listen-addr=/ip4/0.0.0.0/tcp/30333
      - --rpc-port=9944
      - --rpc-external
      - --rpc-cors=all
      - --mine
      - --coinbase=${ANARCHY_COINBASE:?ANARCHY_COINBASE を設定してください}
      - --randomx-mode=light
    networks:
      anarchy:
        ipv4_address: 172.28.0.20
    volumes:
      - chain-data:/data
      - ./torsocks.conf:/etc/tor/torsocks.conf:ro
      - ./chainspec.json:/etc/anarchy/chainspec.json:ro

  storage:
    image: ${ANARCHY_STORAGE_IMAGE:-ghcr.io/moriwakiyusuke/anarchy-storage-node:latest}
    restart: unless-stopped
    depends_on:
      tor:
        condition: service_healthy
      chain:
        condition: service_started
    # storage は torsocks で包まない。
    #
    # torsocks はプロセスの **全て** の outbound を Tor に流すため、包むと
    # ws://chain:9944 (compose ネットワーク内) まで Tor 経由で解決しようとして
    # "Unable to resolve. Status reply: 4" で失敗する。
    # storage の outbound は同一ホストのチェーンだけなので Tor は不要。
    # inbound は tor の Hidden Service が転送するのでこちら側に torsocks は要らない。
    #
    # チェーンが別ホストにある構成 (AWS のストレージ単独ノード) では話が逆で、
    # 包んだ上で --chain-url に .onion を指定すること。
    entrypoint: ["/usr/local/bin/anarchy-storage-node"]
    command:
      - --config=/etc/anarchy/storage.toml
      - --data-dir=/data
      - --rpc-port=3030
      # 他ホストのチェーンからも到達できる .onion を広告する。
      # 初回起動時に tor が生成した hostname を控えて設定すること。
      - --public-url=${ANARCHY_STORAGE_PUBLIC_URL:?tor の anarchy-storage/hostname を設定してください}
      - --chain-url=ws://chain:9944
    networks:
      anarchy:
        ipv4_address: 172.28.0.30
    volumes:
      - storage-data:/data
      - ./storage.toml:/etc/anarchy/storage.toml:ro

networks:
  # tor の HiddenServicePort は転送先にホスト名を受け付けない (IP かソケットのみ) ため、
  # サービス名では書けない。固定 IP を割り当てて torrc から参照する。
  anarchy:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  tor-data:
  chain-data:
  storage-data:
