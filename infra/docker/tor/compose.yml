# Anarchy Tor sidecar (dev convenience)
#
# 目的: ローカル開発で `tor` デーモンと Hidden Service を 1 コマンドで立てる。
# host 上の anarchy-node / anarchy-storage-node バイナリと連携することを前提とし、
# 本番 (バイナリ + systemd) でも同じ torrc を流用できる構成にしている。
#
# 使い方:
#   cd infra/docker/tor && docker compose up -d
#   docker compose logs -f tor               # bootstrap 進捗を見る
#   docker compose exec tor cat /var/lib/tor/anarchy-node/hostname        # P2P/RPC .onion
#   docker compose exec tor cat /var/lib/tor/anarchy-storage/hostname     # storage .onion
#   docker compose down                      # 停止 (volume は保持)
#   docker compose down -v                   # volume も削除 (.onion が再生成される)
#
# 提供するもの:
#   - SOCKS5 proxy: 127.0.0.1:9050  (host バイナリが ALL_PROXY や torsocks 経由で使う)
#   - Hidden Service: anarchy-node    -> host:30333 (libp2p P2P) / host:9944 (RPC/WS)
#   - Hidden Service: anarchy-storage -> host:3030  (storage-node HTTP JSON-RPC)
#
# ネットワーク方針:
#   bridge mode + `host.docker.internal:host-gateway`。
#   `network_mode: host` を使わない理由は Docker Desktop (Mac/Windows/WSL2 Docker Desktop)
#   が "host" を VM の loopback として解釈し、実 host の 127.0.0.1 に届かないため。
#   bridge + extra_hosts で `host.docker.internal` を有効化すれば、Docker Desktop でも
#   ネイティブ Linux Docker でも同じ挙動になる。
services:
  tor:
    build: .
    image: anarchy/tor:local
    container_name: anarchy-tor
    restart: unless-stopped
    extra_hosts:
      # Linux ネイティブ Docker でも host-gateway をサポート (Compose v2.20+)。
      # Docker Desktop は host.docker.internal を組み込みで提供するため上書きされても同義。
      - "host.docker.internal:host-gateway"
    ports:
      # SOCKS5 は host の 127.0.0.1 にのみ bind (LAN 公開しない)。
      # host で system tor (debian-tor) が既に 9050 を握っている場合は
      # `TOR_SOCKS_HOST_PORT=9150 docker compose up -d` のように上書きする。
      - "127.0.0.1:${TOR_SOCKS_HOST_PORT:-9050}:9050"
    volumes:
      - tor-data:/var/lib/tor
      - ./torrc:/etc/tor/torrc:ro
    healthcheck:
      # Tor が SocksPort を listen 始めたら healthy
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 9050"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s

volumes:
  tor-data:
    name: anarchy-tor-data
