# storage-only — storage×10
#
# チェーンを持たない、ストレージ専用ホスト。
# 1GB の箱に storage-node (実測 20MB) を 10 台載せる。
#   10 × 20MB = 200MB + tor 40MB + OS 300MB ≈ 540MB / 1GB
#
# ⚠️ 10 台は同一ホストなので **障害ドメインは 1 つ**。
#    ホストが落ちれば 10 台まとめて落ちる。冗長化ではなく、
#    fan-out 先を増やして KZG-VSS の k/n 分散を実際に働かせるのが目的。
#    本当の冗長化は core / gateway 側のストレージが担う。
#
# core / gateway と決定的に違う点: **チェーンが同一ホストに無い**。
# そのため storage を torsocks で包み、--chain-url に .onion を指定する
# (core では逆に包まない — 同一ホストのチェーンに直結するため)。
#
# 名前空間は tor と共有する。同一ホストに通信相手がいないので
# netns コンテナを挟む必要は無く、AllowOutboundLocalhost で
# tor の SOCKS (127.0.0.1:9050) に届けば足りる。
#
# ⚠️ AWS t3.micro はバースト型。CPU クレジットが尽きると
#    `unlimited` モードでは **追加課金** が発生する。
#    インスタンス作成時にクレジット仕様を `standard` にすること。
#
# 手順:
#   for i in $(seq 1 10); do sed "s/CHANGE_ME/$(openssl rand -hex 32)/" storage.toml.tmpl > storage-$i.toml; done
#   cp .env.example .env
#   docker compose up -d tor
#   docker compose exec tor cat /var/lib/tor/anarchy-storage/hostname   # .env に設定
#   docker compose up -d

services:
  tor:
    build:
      context: ../../docker/tor
    image: anarchy/tor:local
    restart: unless-stopped
    volumes:
      - tor-data:/var/lib/tor
      - ./torrc:/etc/tor/torrc:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 9050"]
      interval: 5s
      timeout: 2s
      retries: 24
      start_period: 10s

  storage-1:
    image: ${ANARCHY_STORAGE_IMAGE:-ghcr.io/moriwakiyusuke/anarchy-storage-node:latest}
    restart: unless-stopped
    network_mode: "service:tor"
    depends_on:
      tor:
        condition: service_healthy
    # チェーンが別ホストなので包む
    entrypoint: ["torsocks", "/usr/local/bin/anarchy-storage-node"]
    command:
      - --config=/etc/anarchy/storage.toml
      - --data-dir=/data
      - --rpc-port=3030
      - --public-url=${STORAGE_PUBLIC_URL_BASE:?tor の anarchy-storage/hostname から設定してください}:3030
      - --chain-url=ws://${CORE_CHAIN_ONION:?core の chain onion を設定してください}:9944
    volumes:
      - storage1-data:/data
      - ./torsocks.conf:/etc/tor/torsocks.conf:ro
      - ./storage-1.toml:/etc/anarchy/storage.toml:ro

  storage-2:
