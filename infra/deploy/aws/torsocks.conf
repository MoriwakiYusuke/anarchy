# compose 構成用の torsocks 設定。
#
# TorAddress は IP のみ (ホスト名は解決されず Connection refused になる)。
# チェーンは netns コンテナと名前空間を共有しているので 127.0.0.1 で届く。
TorAddress 127.0.0.1
TorPort 9050
AllowInbound 1

# 同一ホストのノード同士を Tor に流さないために必須。
# torsocks の除外設定はこれ (127.0.0.0/8) しか無く、サブネット単位の除外はできない。
# これが無いと同一ホストのチェーン同士がピアになれない。
AllowOutboundLocalhost 1
