# gateway — 公開 wss エンドポイント
#
# フロント (Cloudflare Workers) は https:// で配信されるため、接続先も wss:// が必須。
# 別オリジンになるので、チェーンノード側に --rpc-cors <フロントのオリジン> が要る。
#
# ⚠️ Cloudflare のプロキシ (オレンジ雲) は通さないこと。
#    CF はアイドル WebSocket を閉じ、そのタイムアウトは Enterprise でしか変更できない。
#    PAPI の ws-provider は受信側ウォッチドッグだけで ping を送らないため、
#    PoW のブロック間隔の隙間で接続がアイドルになり切断される。
#    DNS レコードは必ず "DNS only" にする。

server {
    listen 80;
    server_name rpc.anarchy2026.org;

    # Let's Encrypt の HTTP-01 検証用
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2 on;` は nginx 1.25.1+ の書式。Ubuntu 24.04 は 1.24 なので
    # listen 行に付ける旧書式を使う。
    listen 443 ssl http2;
    server_name rpc.anarchy2026.org;

    ssl_certificate     /etc/letsencrypt/live/rpc.anarchy2026.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc.anarchy2026.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /rpc {
        # チェーンは netns コンテナの名前空間の中で動いているため、
        # ホストの 127.0.0.1 からは見えない (502 になる)。
        # compose で固定した netns コンテナの IP を指すこと。
        proxy_pass http://172.30.0.10:9944;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Host は "localhost:9944" に固定する。
        #
        # --rpc-cors を特定オリジンに絞ると Substrate は Host ヘッダのフィルタも
        # 有効にし、許可されるのは **listen アドレスの loopback 表現だけ** になる。
        # 実測 (172.30.0.10:9944 に対して各 Host で叩いた結果):
        #   localhost:9944        → OK
        #   127.0.0.1:9944        → OK
        #   172.30.0.10:9944      → Provided Host header is not whitelisted.
        #   0.0.0.0:9944          → 同上
        #   rpc.anarchy2026.org   → 同上
        # そのため $host も $proxy_host も使えない。
        #
        # ブラウザの CORS 判定は Origin ヘッダで行われるので、Host を書き換えても
        # --rpc-cors=https://anarchy2026.org による制限は効いたままになる。
        proxy_set_header Host "localhost:9944";

        # 必須: デフォルトの 60s では PoW のブロック間隔で WS が切れる。
        # chain-client.ts が heartbeatTimeout=300s にしているのと同じ理由
        # (ブロック間隔は指数分布で 40s 超のギャップが日常的に発生する)。
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # RPC 以外は何も出さない
    location / {
        return 404;
    }
}
