# gateway — chain×1 + storage×3
#
# ⚠️ このファイルは gen.py が生成する。手で編集せず、引数を変えて再生成すること:
#   ./gen.py gateway --chains 1 --storage 3 --capacity 5G --bootnode-core --public-rpc --domain rpc.anarchy2026.org --cors-origin https://anarchy2026.org --subnet 30
#
# 設計の根拠は gen.py 冒頭と docs/operations/deployment-multi-provider.md §5 を参照。

services:
  # 名前空間の保持だけを担う (tor の再起動と切り離すため)
  netns:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      anarchy:
        ipv4_address: 172.30.0.10

  tor:
    build:
      context: ../../docker/tor
    image: anarchy/tor:local
    restart: unless-stopped
    network_mode: "service:netns"
    depends_on: [netns]
    volumes:
      - tor-data:/var/lib/tor
      - ./torrc:/etc/tor/torrc:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 9050"]
      interval: 5s
      timeout: 2s
      retries: 24
      start_period: 10s

  # core の chain onion をローカル TCP に落とすトンネル。
  # libp2p は /onion3/ も /dns4/<onion>/ も dial できない (実測済み) ため必須。
  onion-proxy:
    image: alpine/socat:latest
    restart: unless-stopped
    network_mode: "service:netns"
    depends_on:
      tor:
        condition: service_healthy
    command: >-
      TCP-LISTEN:30350,bind=127.0.0.1,reuseaddr,fork
      SOCKS4A:127.0.0.1:${CORE_CHAIN_ONION:?core の chain onion を設定してください}:30333,socksport=9050

  chain-1:
    image: ${ANARCHY_NODE_IMAGE:-ghcr.io/moriwakiyusuke/anarchy-node:latest}
    restart: unless-stopped
    network_mode: "service:netns"
    depends_on:
      tor:
        condition: service_healthy
      onion-proxy:
        condition: service_started
    entrypoint: ["torsocks", "/usr/local/bin/anarchy-node"]
    command:
      - --chain=/etc/anarchy/chainspec.json
      - --base-path=/data
      - --listen-addr=/ip4/0.0.0.0/tcp/30333
      - --rpc-port=9944
      - --prometheus-port=9615
      - --rpc-external
      - --rpc-cors=all
      - --unsafe-force-node-key-generation
      - --bootnodes=/ip4/127.0.0.1/tcp/30350/p2p/${CORE_CHAIN_PEER_ID:?core の chain-1 peer ID を設定してください}
    volumes:
      - chain1-data:/data
      - ./torsocks.conf:/etc/tor/torsocks.conf:ro
      - ./chainspec.json:/etc/anarchy/chainspec.json:ro

  storage-1:
    image: ${ANARCHY_STORAGE_IMAGE:-ghcr.io/moriwakiyusuke/anarchy-storage-node:latest}
    restart: unless-stopped
    depends_on:
      chain-1:
        condition: service_started
    # 同一ホストのチェーンに直結するので torsocks で包まない
    entrypoint: ["/usr/local/bin/anarchy-storage-node"]
    command:
      - --config=/etc/anarchy/storage.toml
      - --data-dir=/data
      - --rpc-port=3030
      - --public-url=${STORAGE_PUBLIC_URL_BASE:?tor の anarchy-storage/hostname から設定してください}:3030
      - --chain-url=ws://172.30.0.10:9944
    networks:
      anarchy:
        ipv4_address: 172.30.0.31
    volumes:
      - storage1-data:/data
      - ./storage-1.toml:/etc/anarchy/storage.toml:ro

  storage-2:
    image: ${ANARCHY_STORAGE_IMAGE:-ghcr.io/moriwakiyusuke/anarchy-storage-node:latest}
    restart: unless-stopped
    depends_on:
      chain-1:
        condition: service_started
    # 同一ホストのチェーンに直結するので torsocks で包まない
    entrypoint: ["/usr/local/bin/anarchy-storage-node"]
    command:
      - --config=/etc/anarchy/storage.toml
      - --data-dir=/data
      - --rpc-port=3031
      - --public-url=${STORAGE_PUBLIC_URL_BASE:?tor の anarchy-storage/hostname から設定してください}:3031
      - --chain-url=ws://172.30.0.10:9944
    networks:
      anarchy:
        ipv4_address: 172.30.0.32
    volumes:
      - storage2-data:/data
      - ./storage-2.toml:/etc/anarchy/storage.toml:ro

  storage-3:
    image: ${ANARCHY_STORAGE_IMAGE:-ghcr.io/moriwakiyusuke/anarchy-storage-node:latest}
    restart: unless-stopped
    depends_on:
      chain-1:
        condition: service_started
    # 同一ホストのチェーンに直結するので torsocks で包まない
    entrypoint: ["/usr/local/bin/anarchy-storage-node"]
    command:
      - --config=/etc/anarchy/storage.toml
      - --data-dir=/data
      - --rpc-port=3032
      - --public-url=${STORAGE_PUBLIC_URL_BASE:?tor の anarchy-storage/hostname から設定してください}:3032
      - --chain-url=ws://172.30.0.10:9944
    networks:
      anarchy:
        ipv4_address: 172.30.0.33
    volumes:
      - storage3-data:/data
      - ./storage-3.toml:/etc/anarchy/storage.toml:ro

networks:
  anarchy:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  tor-data:
  chain1-data:
  storage1-data:
  storage2-data:
  storage3-data:
