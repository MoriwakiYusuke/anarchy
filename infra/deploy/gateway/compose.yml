# gateway — chain×1 + 公開 wss (nginx はホスト側で動かす)
#
# フロントの接続先になる公開エントリポイント。
# core を外部に晒さずに済ませるための前面。
# (今回は GCP の Always Free 枠で運用)
#
# storage×3 も同居させる。台数は **RAM が律速**。
#
# e2-micro の公称は 1GB だが、実測の total は **953Mi**、bootstrap 直後
# (コンテナゼロ) の available が **523Mi** しかない。
#   chain 462MB + tor 40MB + storage×3 60MB = 562MB
# 5 台にすると 602MB で available を超え、チェーンが OOM kill される。
# ストレージが減るよりチェーンが落ちるほうが痛いので 3 台に留める。
# ディスクは 26G 空いているので、1 台あたりの容量を増やして総量は維持する
# (3 台 × 5 GiB = 15 GiB)。
#
# core へは全て Tor 経由。bootnode は socat トンネル経由で指定する。
#
# /dns4/<onion>/ 形式は **動かない** (実測済み)。理由:
#   - sc-network の transport は /onion3/ を dial できない
#   - /dns4/ なら torsocks が拾えるかと思ったが、rust-libp2p の DNS transport は
#     hickory-dns で独自に UDP の DNS 問い合わせをするため libc の getaddrinfo を
#     通らず、torsocks が名前解決を捕捉できない。dial の形跡すら残らず peers=0 のまま
#
# そこで socat で .onion をローカル TCP に落とし、libp2p にはローカルアドレスとして
# 見せる (apps/blockchain/scripts/onion-proxy.sh と同じ手口)。
#
# 手順:
#   cp ../anarchy-portfolio-raw.json chainspec.json
#   docker compose up -d netns tor
#   # .env に CORE_CHAIN_ONION と CORE_CHAIN_PEER_ID を設定
#   docker compose up -d

services:
  netns:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      anarchy:
        ipv4_address: 172.30.0.10

  tor:
    build:
      context: ../../docker/tor
    image: anarchy/tor:local
    restart: unless-stopped
    network_mode: "service:netns"
    depends_on: [netns]
    volumes:
      - tor-data:/var/lib/tor
      - ./torrc:/etc/tor/torrc:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 9050"]
      interval: 5s
      timeout: 2s
      retries: 24
      start_period: 10s

  # .onion をローカル TCP に落とすトンネル。
  # libp2p は /onion3/ を dial できず、/dns4/ も torsocks で捕捉できないため必須。
  onion-proxy:
    image: alpine/socat:latest
    restart: unless-stopped
    network_mode: "service:netns"
    depends_on:
      tor:
        condition: service_healthy
    command: >-
      TCP-LISTEN:30350,bind=127.0.0.1,reuseaddr,fork
      SOCKS4A:127.0.0.1:${CORE_CHAIN_ONION:?core の chain onion を設定してください}:30333,socksport=9050

  chain:
    image: ${ANARCHY_NODE_IMAGE:-ghcr.io/moriwakiyusuke/anarchy-node:latest}
    restart: unless-stopped
    network_mode: "service:netns"
    depends_on:
      tor:
        condition: service_healthy
      onion-proxy:
        condition: service_started
    entrypoint: ["torsocks", "/usr/local/bin/anarchy-node"]
    command:
      - --chain=/etc/anarchy/chainspec.json
      - --base-path=/data
      - --listen-addr=/ip4/0.0.0.0/tcp/30333
      - --rpc-port=9944
      - --rpc-external
      - --rpc-cors=${ANARCHY_RPC_CORS:-all}
      - --unsafe-force-node-key-generation
      # socat が 127.0.0.1:30350 で待ち受け、Tor 経由で core の 30333 に繋ぐ
      - --bootnodes=/ip4/127.0.0.1/tcp/30350/p2p/${CORE_CHAIN_PEER_ID:?core の chain-1 peer ID を設定してください}
    volumes:
      - chain-data:/data
      - ./torsocks.conf:/etc/tor/torsocks.conf:ro
      - ./chainspec.json:/etc/anarchy/chainspec.json:ro

  storage-1:
    image: ${ANARCHY_STORAGE_IMAGE:-ghcr.io/moriwakiyusuke/anarchy-storage-node:latest}
    restart: unless-stopped
    # 同一ホストのチェーンに直結するので torsocks で包まない
    entrypoint: ["/usr/local/bin/anarchy-storage-node"]
    depends_on:
      chain:
        condition: service_started
    command:
      - --config=/etc/anarchy/storage.toml
      - --data-dir=/data
      - --rpc-port=3030
      - --public-url=${STORAGE_PUBLIC_URL_BASE:?tor の anarchy-storage/hostname から設定してください}:3030
      - --chain-url=ws://172.30.0.10:9944
    networks:
      anarchy:
        ipv4_address: 172.30.0.31
    volumes:
      - storage1-data:/data
      - ./storage-1.toml:/etc/anarchy/storage.toml:ro

  storage-2:
    image: ${ANARCHY_STORAGE_IMAGE:-ghcr.io/moriwakiyusuke/anarchy-storage-node:latest}
    restart: unless-stopped
    # 同一ホストのチェーンに直結するので torsocks で包まない
    entrypoint: ["/usr/local/bin/anarchy-storage-node"]
    depends_on:
      chain:
        condition: service_started
    command:
      - --config=/etc/anarchy/storage.toml
      - --data-dir=/data
      - --rpc-port=3031
      - --public-url=${STORAGE_PUBLIC_URL_BASE:?tor の anarchy-storage/hostname から設定してください}:3031
      - --chain-url=ws://172.30.0.10:9944
    networks:
      anarchy:
        ipv4_address: 172.30.0.32
    volumes:
      - storage2-data:/data
      - ./storage-2.toml:/etc/anarchy/storage.toml:ro

  storage-3:
    image: ${ANARCHY_STORAGE_IMAGE:-ghcr.io/moriwakiyusuke/anarchy-storage-node:latest}
    restart: unless-stopped
    # 同一ホストのチェーンに直結するので torsocks で包まない
    entrypoint: ["/usr/local/bin/anarchy-storage-node"]
    depends_on:
      chain:
        condition: service_started
    command:
      - --config=/etc/anarchy/storage.toml
      - --data-dir=/data
      - --rpc-port=3032
      - --public-url=${STORAGE_PUBLIC_URL_BASE:?tor の anarchy-storage/hostname から設定してください}:3032
      - --chain-url=ws://172.30.0.10:9944
    networks:
      anarchy:
        ipv4_address: 172.30.0.33
    volumes:
      - storage3-data:/data
      - ./storage-3.toml:/etc/anarchy/storage.toml:ro



networks:
  anarchy:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  tor-data:
  chain-data:
  storage1-data:
  storage2-data:
  storage3-data:
