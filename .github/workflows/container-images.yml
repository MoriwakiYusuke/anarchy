name: Container Images

# チェーンノード / ストレージノードのイメージをビルドして ghcr.io に push する。
#
# GITHUB_TOKEN がそのまま ghcr への push に使えるので、追加のシークレットは不要
# (packages: write 権限だけ付与する)。
#
# PR では push せずビルドのみ (Dockerfile が壊れていないことの確認)。
# main への push と タグ (v*) で ghcr に上がる。

on:
  pull_request:
    paths:
      - 'apps/blockchain/**'
      - 'apps/storage-node/**'
      - 'infra/docker/chain/**'
      - 'infra/docker/storage/**'
      - '.github/workflows/container-images.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/blockchain/**'
      - 'apps/storage-node/**'
      - 'infra/docker/chain/**'
      - 'infra/docker/storage/**'
      - '.github/workflows/container-images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Substrate の release ビルドは時間がかかる。storage は短いが同じ枠で回す。
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: anarchy-node
            dockerfile: infra/docker/chain/Dockerfile
          - name: anarchy-storage-node
            dockerfile: infra/docker/storage/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # PR ではビルドのみで push しないため、ログインも main/tag のときだけ行う
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 全ホストが x86_64 なので単一アーキで足りる
          platforms: linux/amd64
          # GitHub Actions のキャッシュで cargo の再ビルドを避ける
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke test the image
        # push したイメージではなくローカルにロードしたものを叩きたいので、
        # ここでは build-push-action の出力タグの 1 つを使って再実行する
        run: |
          set -euo pipefail
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          echo "testing $IMAGE"
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            echo "PR ではイメージを push していないためスキップ"
            exit 0
          fi
          # このバイナリは --version を受け付けない (clap の設定上)。
          # --help が正常終了することでイメージが起動可能なことを確認する。
          docker run --rm "$IMAGE" --help > /dev/null
          echo "OK: $IMAGE starts"
