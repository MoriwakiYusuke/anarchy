[package]
name = "anarchy-storage-node"
version = "0.1.0"
edition = "2021"
description = "Distributed storage node daemon for Anarchy network"
license = "MIT"
authors = ["Anarchy Team"]
repository = "https://github.com/anarchy-project/anarchy"

[[bin]]
name = "anarchy-storage-node"
path = "src/main.rs"

[dependencies]
# libp2p for P2P networking
libp2p = { version = "0.54", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "request-response",
    "macros",
    "ed25519",
    "identify",
] }

# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging & Metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto & Encoding
hex = "0.4"
blake2 = "0.10"

# File system
walkdir = "2"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# subxt for chain interaction
# Note: Add subxt after initial scaffold works
# subxt = "0.37"

[dev-dependencies]
tempfile = "3.10"
