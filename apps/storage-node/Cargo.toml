[package]
name = "anarchy-storage-node"
version = "0.1.0"
edition = "2021"
description = "Distributed storage node daemon for Anarchy network"
license = "MIT"
authors = ["Anarchy Team"]
repository = "https://github.com/anarchy-project/anarchy"

[lib]
name = "anarchy_storage_node"
path = "src/lib.rs"

[[bin]]
name = "anarchy-storage-node"
path = "src/main.rs"

[dependencies]
# libp2p for P2P networking
libp2p = { version = "0.54", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "request-response",
    "macros",
    "ed25519",
    "identify",
    "gossipsub",
] }

# Concurrency primitives
parking_lot = "0.12"

# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Secure memory handling
zeroize = "1.7"
toml = "0.8"

# Logging & Metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto & Encoding
hex = "0.4"
blake2 = "0.10"
base64 = "0.22"
schnorrkel = "0.11"
bs58 = "0.5"

# File system
walkdir = "2"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# KZG proof generation (arkworks stack)
ark-bls12-381 = { version = "0.5", default-features = true, features = ["curve"] }
ark-ec = "0.5"
ark-ff = "0.5"
ark-poly = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"

# CLI
clap = { version = "4.4", features = ["derive"] }

# HTTP JSON-RPC server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# HTTP client for blockchain node registration
reqwest = { version = "0.12", features = ["json"] }

# subxt for chain interaction
subxt = "0.38"
subxt-signer = { version = "0.38", features = ["sr25519"] }

[dev-dependencies]
tempfile = "3.10"
rand = "0.8"
