# Anarchy Storage Node Configuration
# Copy this file to config.toml and adjust as needed

# Directory for storing node data (identity, fragments)
# Default: "./data"
data_dir = "./data"

# Maximum storage capacity in bytes
# Default: 10GB (10737418240)
capacity = 10737418240

# Chain RPC endpoint URL
# Default: "ws://127.0.0.1:9944"
chain_url = "ws://127.0.0.1:9944"

# libp2p listen address (multiaddr format)
# Default: "/ip4/0.0.0.0/tcp/4001"
listen_addr = "/ip4/0.0.0.0/tcp/4001"

# Rate limit for declare_holding calls per minute (FR-108)
# Default: 10
declare_rate_limit = 10

# HTTP JSON-RPC port for blockchain node communication
# Default: 3030
# Set STORAGE_NODE_URL=http://localhost:3030 on blockchain node
rpc_port = 3030

# ============================================================
# Multi-Node Configuration (010-multi-node-storage)
# ============================================================

# Node identifier for multi-node setup (optional)
# Used for logging and debugging in distributed environments
# node_id = "storage-node-1"

# P2P bootstrap nodes for fragment replication (multiaddr format)
# Empty list for standalone node, add peers for distributed setup
# Example:
# bootstrap_peers = [
#   "/ip4/192.168.1.10/tcp/4001/p2p/QmXxxx...",
#   "/ip4/192.168.1.11/tcp/4001/p2p/QmYyyy..."
# ]
bootstrap_peers = []

# ============================================================
# On-Chain Registration (Global Discovery)
# ============================================================
# 
# To enable global discovery across all chain nodes, operators should
# register their storage node on-chain using the `register_node` extrinsic.
# This stores the HTTP URL in blockchain state, allowing any chain node
# to discover and route fragments to this storage node.
#
# Registration requires:
# 1. operator_account: Account with sufficient balance for tx fees
# 2. peer_id: libp2p PeerID (from data_dir/identity/peer_id.txt)
# 3. capacity: Storage capacity in bytes
# 4. pow_nonce: Proof-of-work nonce (difficulty-based)
# 5. http_url: This node's HTTP endpoint (e.g., "http://your-ip:3030")
#
# Example using polkadot-js:
# ```javascript
# api.tx.storage.registerNode(peerId, capacity, powNonce, httpUrl)
# ```
#
# Without on-chain registration, the storage node is only visible to
# the chain node it registers with via storage_registerEndpoint RPC.

# ============================================================
# Authentication (010-multi-node-storage)
# ============================================================

# Enable Sr25519 signature verification for fragment uploads
# When true, requires valid signature in X-Anarchy-Auth header
# Default: true (authentication enabled by default per FR-201)
auth_enabled = true

# ============================================================
# Signer Configuration (Extrinsic Signing)
# ============================================================

# Sr25519 signer seed for signing extrinsics (hex 32 bytes)
# This account receives storage rewards from prove_holding_kzg
# (#30-C-3) ===========================================================
# *** REQUIRED: replace this placeholder before starting the storage-node ***
#
# Generate your own with one of:
#   openssl rand -hex 32
#   subkey generate --scheme sr25519
#
# DO NOT commit a real seed and DO NOT reuse a dev account in production —
# the keys below are public and anyone can claim/move funds with them.
#
# Dev accounts (LOCAL TESTNET ONLY — never in production):
#   Alice:   e5be9a5092b81bca64be81d212e7f2f9eba183bb7a90954f7b76361f6edb5c0a
#   Bob:     398f0c28f98885e046333d4a41c19cee4c37368a9832c6502f6cfd182e2aef89
#   Charlie: bc1ede780f784bb6991a585e4f6e61522c14e1cae6324f92e34dd3db81a39a12
# =====================================================================
signer_seed = "REPLACE_WITH_REAL_SEED_FROM_openssl_rand_hex_32"

# ============================================================
# KZG Proof Configuration (011-kzg-proof-rewards)
# ============================================================

# Path to SRS (Structured Reference String) file for KZG proofs
# Supports both formats:
# 1. Binary format (4-byte header + G1 points + G2 point)
# 2. Text format (Ethereum KZG Ceremony trusted_setup.txt)
#
# For production, use the Ethereum KZG Ceremony trusted setup from:
# https://github.com/ethereum/c-kzg-4844/blob/main/src/trusted_setup.txt
#
# Default: "" (uses insecure test SRS in dev_mode)
# srs_path = "/path/to/trusted_setup.txt"
srs_path = ""

# Development mode - uses insecure test SRS if srs_path is empty
# WARNING: Test SRS uses known tau=12345, NOT cryptographically secure!
# Set to false and provide srs_path for production
dev_mode = true

# ============================================================
# Repair Protocol Configuration (013-slashing-repair)
# ============================================================

# Repair scheduler check interval in seconds
# How often to poll for AtRisk fragments that need repair
# Default: 30
repair_check_interval_secs = 30

# Repair timeout in seconds
# Maximum time a fragment can stay in Repairing state before timeout
# Default: 3600 (60 minutes)
repair_timeout_secs = 3600

# Maximum concurrent repairs
# Number of fragments that can be repaired simultaneously
# Default: 5
repair_max_concurrent = 5

# Threshold k for share regeneration (k-of-n scheme)
# Default: 3 (need 3 shares to regenerate)
repair_threshold_k = 3

# Total shares n (k-of-n scheme)
# Default: 5 (5 shares total per fragment)
repair_total_shares_n = 5

# Share collection timeout in seconds
# How long to wait for donor nodes to respond with shares
# Default: 30
repair_share_collect_timeout_secs = 30
