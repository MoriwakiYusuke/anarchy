[workspace]
resolver = "2"
members = [
    "node",
    "runtime",
    "pallets/post",
    "pallets/faucet",
    "pallets/storage",
    "pallets/nickname",
    "pallets/stealth",
    "pallets/reaction",
    "pallets/messaging",
    "pallets/popularity",
    "pallets/difficulty",
    "pallets/block_reward",
    "pallets/grandpa_authority_election",
    "pallets/storage_stake",
    "primitives/pow",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.package]
authors = ["Anarchy Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/anarchy-project/anarchy"

[workspace.dependencies]
# Substrate dependencies - Polkadot SDK stable2503
frame-support = { version = "45.1.0", default-features = false }
frame-system = { version = "45.0.0", default-features = false }
frame-executive = { version = "45.0.0", default-features = false }
frame-benchmarking = { version = "45.0.0", default-features = false }
sp-core = { version = "39.0.0", default-features = false }
sp-std = { version = "14.0.0", default-features = false }
sp-runtime = { version = "45.0.0", default-features = false }
sp-api = { version = "40.0.0", default-features = false }
sp-io = { version = "44.0.0", default-features = false }
sp-version = { version = "43.0.0", default-features = false }
sp-genesis-builder = { version = "0.21.0", default-features = false }
sp-storage = { version = "22.0.0", default-features = false }
sp-block-builder = { version = "40.0.0", default-features = false }
sp-transaction-pool = { version = "40.0.0", default-features = false }
sp-offchain = { version = "40.0.0", default-features = false }
sp-session = { version = "42.0.0", default-features = false }
sp-inherents = { version = "40.0.0", default-features = false }
sp-consensus-aura = { version = "0.46.0", default-features = false }
sp-consensus-grandpa = { version = "27.0.0", default-features = false }
sp-timestamp = { version = "40.0.0", default-features = false }
sp-keyring = { version = "45.0.0", default-features = false }
sp-blockchain = { version = "43.0.0" }
frame-system-rpc-runtime-api = { version = "40.0.0", default-features = false }

pallet-balances = { version = "46.0.0", default-features = false }
pallet-timestamp = { version = "44.0.0", default-features = false }
pallet-transaction-payment = { version = "45.0.0", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { version = "45.0.0", default-features = false }
pallet-aura = { version = "44.0.0", default-features = false }
pallet-grandpa = { version = "45.0.0", default-features = false }
pallet-sudo = { version = "45.0.0", default-features = false }

# Node dependencies
sc-cli = "0.57.0"
sc-executor = "0.47.0"
sc-service = "0.56.0"
sc-client-api = "44.0.0"
sc-consensus = "0.54.0"
sc-consensus-aura = "0.55.0"
sc-consensus-grandpa = "0.40.0"
# Aligned with stable2503 versions (sc-consensus 0.54 / sp-runtime 45 / sp-api 40 / sp-core 39)
sc-consensus-pow = "0.54.0"
sp-consensus-pow = { version = "0.46.0", default-features = false }
randomx-rs = { version = "1.4.1", default-features = false }
sc-network = "0.55.0"
sc-transaction-pool = "44.1.0"
sc-transaction-pool-api = "43.0.0"
sc-rpc-api = "0.54.0"
sc-basic-authorship = "0.53.0"
sc-offchain = "50.0.0"
sc-telemetry = "30.0.0"
substrate-frame-rpc-system = "49.0.0"
pallet-transaction-payment-rpc = "48.0.0"

# Codec
parity-scale-codec = { version = "3.6.9", default-features = false, features = ["derive"] }
scale-info = { version = "2.10.0", default-features = false, features = ["derive"] }

# Cryptography (WebAuthn)
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "alloc"] }
ecdsa = { version = "0.16", default-features = false, features = ["verifying"] }
sha2 = { version = "0.10", default-features = false }

# Other
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
futures = "0.3"
jsonrpsee = { version = "0.24", features = ["server"] }
log = "0.4"

# Local pallets
pallet-post = { path = "pallets/post", default-features = false }
pallet-faucet = { path = "pallets/faucet", default-features = false }
pallet-storage = { path = "pallets/storage", default-features = false }
pallet-nickname = { path = "pallets/nickname", default-features = false }
pallet-stealth = { path = "pallets/stealth", default-features = false }
pallet-reaction = { path = "pallets/reaction", default-features = false }
pallet-messaging = { path = "pallets/messaging", default-features = false }
pallet-difficulty = { path = "pallets/difficulty", default-features = false }
pallet-block-reward = { path = "pallets/block_reward", default-features = false }
pallet-grandpa-authority-election = { path = "pallets/grandpa_authority_election", default-features = false }
pallet-storage-stake = { path = "pallets/storage_stake", default-features = false }
primitives-pow = { path = "primitives/pow", default-features = false }
anarchy-runtime = { path = "runtime" }

[profile.release]
panic = "unwind"
