[package]
name = "anarchy-node"
version = "0.1.0"
edition.workspace = true
# The node binary links sc-cli / sc-service / sc-network / sc-consensus-* etc.
# which are GPL-3.0-or-later WITH Classpath-exception-2.0. The compiled
# binary must therefore be distributed under the same terms. The runtime
# Wasm blob (compiled separately) remains Apache-2.0.
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
authors.workspace = true
repository.workspace = true

[dependencies]
clap = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
jsonrpsee = { workspace = true }
log = { workspace = true }

# Storage RPC dependencies
blake2 = "0.10"
rs_merkle = "1.5"
async-trait = "0.1"
base64 = "0.22"
hex = "0.4"
serde = { workspace = true }
parity-scale-codec = { workspace = true }

# Substrate Client
sc-cli = { workspace = true }
sc-executor = { workspace = true }
sc-service = { workspace = true }
sc-client-api = { workspace = true }
sc-consensus = { workspace = true }
sc-consensus-grandpa = { workspace = true }
sc-consensus-pow = { workspace = true }
sp-consensus-pow = { workspace = true, default-features = true }
randomx-rs = { workspace = true, default-features = true }
frame-support = { workspace = true, default-features = true }
sc-network = { workspace = true }
sc-transaction-pool = { workspace = true }
sc-transaction-pool-api = { workspace = true }
sc-rpc-api = { workspace = true }
sc-basic-authorship = { workspace = true }
sc-offchain = { workspace = true }
sc-telemetry = { workspace = true }

# Substrate Primitives
sp-core = { workspace = true, features = ["std"] }
sp-io = { workspace = true }
sp-runtime = { workspace = true, features = ["std"] }
sp-timestamp = { workspace = true, features = ["std"] }
sp-inherents = { workspace = true, features = ["std"] }
sp-keyring = { workspace = true, features = ["std"] }
sp-consensus-grandpa = { workspace = true, features = ["std"] }
sp-block-builder = { workspace = true, features = ["std"] }
sp-blockchain = { workspace = true }
sp-api = { workspace = true, features = ["std"] }

# RPC
substrate-frame-rpc-system = { workspace = true }
pallet-transaction-payment-rpc = { workspace = true }

# HTTP client for Storage Node communication
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
# Endpoint URL validation (SSRF 対策, reqwest 経由で既に依存ツリーに存在)
url = "2"

# Concurrency primitives
parking_lot = "0.12"

# Random selection (FR-101)
rand = "0.8"

# KZG verification (arkworks stack)
ark-bls12-381 = { version = "0.5", default-features = false, features = ["std", "curve"] }
ark-ec = { version = "0.5", default-features = false, features = ["std"] }
ark-ff = { version = "0.5", default-features = false, features = ["std"] }
ark-serialize = { version = "0.5", default-features = false, features = ["std"] }

# Shared KZG constants
kzg-constants = { path = "../../../packages/kzg-constants", features = ["std"] }

# Local
anarchy-runtime = { workspace = true, features = ["std"] }
pallet-post = { workspace = true, features = ["std"] }
pallet-storage = { workspace = true, features = ["std"] }
pallet-difficulty = { workspace = true, default-features = true }
# TSTS F9: economic metrics (snapshot type + RuntimeApi)
pallet-economic-params = { workspace = true, features = ["std"] }
# TSTS F9: Substrate Prometheus endpoint (Gauge / Counter register API)
substrate-prometheus-endpoint = { version = "0.17.2" }

[build-dependencies]
substrate-build-script-utils = "11.0.0"
